
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b14">
    <title>Community Poll | B.Com Classroom</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 28px 16px;
            font-family: Inter, Arial, sans-serif;
            color: #f3f4f6;
            background:
                radial-gradient(circle at 10% 5%,
                    rgba(59, 130, 246, .18), transparent 35%),
                radial-gradient(circle at 90% 90%,
                    rgba(139, 92, 246, .16), transparent 35%),
                #080b14;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 28px 12px;
        }

        .eyebrow {
            color: #93c5fd;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        h1 {
            margin: 16px 0 12px;
            font-size: clamp(28px, 5vw, 42px);
        }

        .intro {
            max-width: 600px;
            margin: 0 auto;
            color: #b7c0d1;
            line-height: 1.8;
        }

       .poll-card {
    padding: 24px;
    border: 1px solid rgba(147, 197, 253, .25);
    border-radius: 22px;
    background: rgba(17, 24, 39, .88);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
    backdrop-filter: blur(18px);
    overflow: hidden;
}

.poll-frame {
    display: block;
    width: 100%;
    max-width: 100%;
    min-height: 650px;
    border: 0;
    border-radius: 14px;
    background: #ffffff;
}
        .poll-frame {
            display: block;
            width: 100%;
            min-height: 650px;
            border: 0;
            border-radius: 14px;
            background: transparent;
        }

        .footer {
            padding: 24px 8px;
            text-align: center;
            color: #7f8ba3;
            font-size: 13px;
        }

        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: #93c5fd;
            text-decoration: none;
        }

        .back-link:hover {
            color: #c4b5fd;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 10px;
            }

            .poll-card {
                padding: 10px;
                border-radius: 16px;
            }

            .poll-frame {
                min-height: 700px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header class="header">
            <div class="eyebrow">B.COM CLASSROOM · COMMUNITY POLL</div>
            <h1>Your Voice Matters!</h1>
            <p class="intro">
                Help us improve B.Com Classroom.
                Share your feedback through the poll below.
            </p>
        </header>

        <section class="poll-card" aria-label="Community feedback poll">
            <!-- Replace this URL when using a different Tally poll. -->
            <iframe
                class="poll-frame"
                
data-tally-src=
https://tally.so/embed/Dq2kXZ?hideTitle=1&dynamicHeight=1


                loading="lazy"
                title="B.Com Classroom community poll">
            </iframe>
        </section>

        <footer class="footer">
            Thank you for helping improve B.Com Classroom.
            <br>
            <a class="back-link" href="index.html">Back to home</a>
        </footer>
    </main>

    <script>
        (function () {
            const frame = document.querySelector("[data-tally-src]");

            function loadPoll() {
                if (window.Tally &&
                    typeof window.Tally.loadEmbeds === "function") {
                    window.Tally.loadEmbeds();
                } else {
                    frame.src = frame.dataset.tallySrc;
                }
            }

            loadPoll();
        })();
    </script>
</body>
</html>
